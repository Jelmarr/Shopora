services:

  postgres:
    image: postgres:18
    container_name: shopora-postgres
    environment:
      POSTGRES_DB: saas-ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jelmar123

    ports:
      - "5432:5432"

    volumes:
     - postgres-data:/var/lib/postgresql

  api:
    image: shopora-api
    container_name: shopora-backend-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=saas-ecommerce;Username=postgres;Password=jelmar123
    depends_on:
      - postgres

  client:
    image: shopora-client
    container_name: shopora-nextjs-client
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api

volumes:
  postgres-data: